name: Runtime compatibility

on:
  push:
    branches: [main, stride/main, 'publish/v*']
    tags: ['v[1-9].[0-9]+.[0-9]+', 'v[1-9][0-9]+.[0-9]+.[0-9]+']
  pull_request:

permissions:
  contents: read

jobs:
  clean-install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release-tag: ${{ steps.source.outputs.tag }}
    steps:
      - name: Select the release tag
        id: source
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) tag="${GITHUB_REF#refs/tags/}" ;;
            refs/heads/publish/v*) tag="${GITHUB_REF#refs/heads/publish/}" ;;
            *) exit 0 ;;
          esac
          printf 'tag=%s\nref=refs/tags/%s\n' "$tag" "$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - name: Install into a fresh store
        run: pnpm install --frozen-lockfile --store-dir "$RUNNER_TEMP/dsh-pnpm-store"
      - run: pnpm run check:runtime
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run test:benchmark
      - run: pnpm run build
      - run: pnpm --filter dsh-browser-extension run build:firefox
      - run: pnpm run test:smoke
      - name: Prepare and verify the installation files
        run: |
          pnpm run release:prepare -- --out "$RUNNER_TEMP/stride-release"
          pnpm run test:smoke-release -- --dir "$RUNNER_TEMP/stride-release"
      - name: Verify the version tag and checksums
        if: steps.source.outputs.tag != ''
        working-directory: ${{ runner.temp }}/stride-release
        env:
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import { execFileSync } from 'node:child_process'
          import { readFileSync } from 'node:fs'

          const release = JSON.parse(readFileSync('versions.json', 'utf8'))
          const git = (...args) => execFileSync('git', args, {
            cwd: process.env.GITHUB_WORKSPACE, encoding: 'utf8',
          }).trim()
          assert.equal(release.development, false)
          assert.equal(release.dirty, false)
          assert.equal('v' + release.version, process.env.RELEASE_TAG)
          assert.equal(release.commit, git('rev-parse', 'HEAD'))
          assert.equal(release.commit, git('rev-parse', 'refs/tags/' + process.env.RELEASE_TAG + '^{commit}'))
          JS
          sha256sum -c SHA256SUMS
          git -C "$GITHUB_WORKSPACE" for-each-ref --format='%(contents)' "refs/tags/$RELEASE_TAG" > release-notes.md
          test -s release-notes.md
      - name: Keep the verified installation files
        if: steps.source.outputs.tag != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stride-release
          path: ${{ runner.temp }}/stride-release
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push' && needs.clean-install.outputs.release-tag != ''
    needs: clean-install
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: stride-release
          path: ${{ runner.temp }}/stride-release
      - name: Publish the verified installation files
        working-directory: ${{ runner.temp }}/stride-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.clean-install.outputs.release-tag }}
        run: |
          sha256sum -c SHA256SUMS
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --notes-file release-notes.md --title "DSH Stride ${RELEASE_TAG#v}" \
            dsh-browser-stride-host-*.tgz dsh-browser-stride-chrome-*.zip \
            install-host.mjs versions.json SHA256SUMS README.md
