name: Runtime compatibility

on:
  push:
    branches: [main, stride/main]
    tags: ['v[1-9].[0-9]+.[0-9]+', 'v[1-9][0-9]+.[0-9]+.[0-9]+']
  pull_request:

permissions:
  contents: read

jobs:
  clean-install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false
      - name: Install into a fresh store
        run: pnpm install --frozen-lockfile --store-dir "$RUNNER_TEMP/dsh-pnpm-store"
      - run: pnpm run check:runtime
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run test:benchmark
      - run: pnpm run build
      - run: pnpm --filter dsh-browser-extension run build:firefox
      - run: pnpm run test:smoke
      - name: Prepare and verify the installation files
        run: |
          pnpm run release:prepare -- --out "$RUNNER_TEMP/stride-release"
          pnpm run test:smoke-release -- --dir "$RUNNER_TEMP/stride-release"
      - name: Verify the version tag and checksums
        if: github.ref_type == 'tag'
        working-directory: ${{ runner.temp }}/stride-release
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import { execFileSync } from 'node:child_process'
          import { readFileSync } from 'node:fs'

          const release = JSON.parse(readFileSync('versions.json', 'utf8'))
          const commit = execFileSync('git', ['rev-parse', 'HEAD'], {
            cwd: process.env.GITHUB_WORKSPACE, encoding: 'utf8',
          }).trim()
          assert.equal(release.development, false)
          assert.equal(release.dirty, false)
          assert.equal(release.commit, commit)
          assert.equal('v' + release.version, process.env.GITHUB_REF_NAME)
          JS
          sha256sum -c SHA256SUMS
      - name: Keep the verified installation files
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stride-release
          path: ${{ runner.temp }}/stride-release
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: clean-install
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: stride-release
          path: ${{ runner.temp }}/stride-release
      - name: Publish the verified installation files
        working-directory: ${{ runner.temp }}/stride-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sha256sum -c SHA256SUMS
          gh release create "$RELEASE_TAG" \
            --verify-tag --notes-from-tag --title "DSH Stride ${RELEASE_TAG#v}" \
            dsh-browser-stride-host-*.tgz dsh-browser-stride-chrome-*.zip \
            install-host.mjs versions.json SHA256SUMS README.md
