name: Question
description: Ask how to use DSH Stride or its documented features
title: "[question] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Check `README.md` first. Use the private channel in `SECURITY.md` for security reports. If it is unavailable,
        use this form only to request a private contact channel; do not include vulnerability details.
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
      description: Describe the task and the page type (http/https/localhost). Do not paste personal URLs.
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What have you tried?
      description: Commands, settings, docs you read, and what happened.
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Environment (optional)
      description: OS, Chrome version, DSH version, and whether the bridge is installed in your desktop profile.
    validations:
      required: false
